[project]
name = "gdkrmr-com"
version = "0.1.0"
description = "Sources of gdkrmr.com, a Quarto website, plus the build helpers"
readme = "README.md"
authors = [
    { name = "Guido Kraemer", email = "guido.kraemer@uni-leipzig.de" }
]
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
gdkrmr-com = "gdkrmr_com:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
